[book]
title = "Pify Agent Book (中文)"
description = "Pi Agent SDK 源码阅读笔记"
authors = ["Pi Docs Contributors"]
language = "zh"
src = "src"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.strip-frontmatter]
command = "python \"../scripts/lib/strip-frontmatter.py\""

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/OWNER/pi-docs"
additional-css = ["theme/custom.css"]
edit-url-template = "https://github.com/OWNER/pi-docs/edit/main/zh/src/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
copy-js = true
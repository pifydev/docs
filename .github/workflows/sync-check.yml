name: Sync Check (PR only)

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate sync + frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate sync, frontmatter, and Mermaid
        run: npm run lint

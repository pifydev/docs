name: GitBook Content Quality

on:
  pull_request:
    paths:
      - "content/**"
      - "source/**"
      - "src/content/docs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "source/**"
      - "src/content/docs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitbook-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate GitBook content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:content
      - run: npm run lint:gitbook
      - run: npm run lint

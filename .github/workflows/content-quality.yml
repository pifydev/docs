name: Content Quality

on:
  pull_request:
    paths:
      - "content/**"
      - "course/**"
      - "source/**"
      - "scripts/**"
      - "tests/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "course/**"
      - "source/**"
      - "scripts/**"
      - "tests/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate content and application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality:content

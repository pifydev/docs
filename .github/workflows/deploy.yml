name: Next.js Application Build

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "course/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "proxy.ts"
      - "source.config.ts"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "course/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "proxy.ts"
      - "source.config.ts"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

[book]
title = "Pi Agent Book (English)"
description = "Source-code reading notes for Pi Agent SDK"
authors = ["Pi Docs Contributors"]
language = "en"
src = "src"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/OWNER/pi-docs"
edit-url-template = "https://github.com/OWNER/pi-docs/edit/main/en/src/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
copy-js = true


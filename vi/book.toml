[book]
title = "Pify Agent Book (Tiếng Việt)"
description = "Ghi chú đọc source code của Pi Agent SDK"
authors = ["Pi Docs Contributors"]
language = "vi"
src = "src"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.strip-frontmatter]
command = "python \"../scripts/lib/strip-frontmatter.py\""

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/OWNER/pi-docs"
additional-css = ["theme/custom.css", "theme/lang-switcher.css"]
edit-url-template = "https://github.com/OWNER/pi-docs/edit/main/vi/src/{path}"
additional-js = ["theme/lang-switcher.js", "mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
copy-js = true